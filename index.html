<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ROKTOBONDHU">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>রক্তবন্ধু – ROKTOBONDHU</title>
<style>
:root{--bg:#fbf4f4;--sf:#fff;--ink:#241a1c;--mu:#7a6e70;--ln:#efe3e4;--rd:#c8102e;--rd2:#8f0b20;--gn:#0f8a55;--tn:#fde8eb;--sh:0 2px 10px rgba(120,20,40,.08)}
@media(prefers-color-scheme:dark){:root{--bg:#150f10;--sf:#211a1b;--ink:#f6eeee;--mu:#ae9fa1;--ln:#3a2e30;--rd:#ef4a62;--tn:#3b1b21;--gn:#3ecf8e;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hind Siliguri","Noto Sans Bengali",system-ui,sans-serif;line-height:1.55;max-width:560px;margin-inline:auto;padding:env(safe-area-inset-top) 0 90px;min-height:100vh}
main{padding:0 16px}.card{background:var(--sf);border-radius:16px;padding:14px;margin:10px 0;box-shadow:var(--sh);border:1px solid var(--ln)}
.sp{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}.sp h1{margin:6px 0 0;font-size:2.4rem;color:var(--rd)}.sp small{letter-spacing:2px;font-weight:700}
.ld{width:26px;height:26px;border:3px solid var(--tn);border-top-color:var(--rd);border-radius:50%;animation:r 1s linear infinite;margin-top:30px}@keyframes r{to{transform:rotate(360deg)}}
.il{font-size:5rem;background:var(--tn);border-radius:50%;width:170px;height:170px;display:grid;place-items:center;margin-bottom:12px}
.dots{display:flex;gap:6px;justify-content:center;margin:10px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--ln)}.dots i:first-child{background:var(--rd)}
.top{display:flex;align-items:center;gap:8px;padding:12px 16px}.top b{font-size:1.2rem;color:var(--rd);flex:1}
.hd{display:flex;align-items:center;gap:10px;padding:12px 16px;font-weight:700;font-size:1.1rem}.hd button{font:inherit;background:var(--sf);border:1px solid var(--ln);border-radius:50%;width:38px;height:38px;color:var(--ink)}
.hero{background:linear-gradient(135deg,var(--rd),var(--rd2));color:#fff;border-radius:22px;padding:20px 18px;margin:6px 0}.hero h2{margin:0 0 10px;font-size:1.6rem;line-height:1.25}
.hero input{margin:0;border:0}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.tiles button{font:inherit;background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px 8px;color:var(--ink);box-shadow:var(--sh);font-weight:600;cursor:pointer}.tiles span{display:block;font-size:1.7rem}
label{display:block;font-size:.82rem;color:var(--mu);margin:10px 0 4px}
select,input,textarea{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--bg);color:var(--ink);margin-bottom:6px}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.chips button,.seg button{font:inherit;font-weight:700;padding:9px 0;border-radius:12px;border:1.5px solid var(--ln);background:var(--sf);color:var(--ink)}.chips button.on,.seg button.on{background:var(--rd);border-color:var(--rd);color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:10px}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:13px;width:100%;background:var(--rd);color:#fff;margin-top:10px;cursor:pointer;text-decoration:none;display:block;text-align:center}.btn.s{display:inline-block;width:auto;padding:8px 14px;margin:6px 6px 0 0}.btn.g{background:var(--gn)}.btn.m{background:var(--mu)}.btn.o{background:none;color:var(--rd);border:1.5px solid var(--rd)}
.row{display:flex;gap:12px;align-items:center}.f1{flex:1;min-width:0}.mu{color:var(--mu);font-size:.82rem}
.av{width:48px;height:48px;border-radius:50%;background:var(--tn);color:var(--rd);display:grid;place-items:center;font-weight:800;font-size:1.2rem;flex:none}.av.l{width:96px;height:96px;font-size:2.4rem;margin:0 auto}
.bd,.bg2{background:var(--rd);color:#fff;border-radius:8px;padding:0 8px;font-weight:700;font-size:.85rem}.bg2{font-size:1.2rem;padding:8px 10px;border-radius:12px}
.tg{font-size:.75rem;padding:1px 9px;border-radius:99px;display:inline-block;margin-top:2px}.tg.g{background:#dff5ea;color:#0b6b43}.tg.o{background:#fff0d8;color:#946200}.tg.v{background:var(--tn);color:var(--rd)}
.pv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.pv img{width:100%;height:90px;object-fit:cover;border-radius:8px}
.empty{text-align:center;color:var(--mu);padding:24px 8px}.pw{position:relative}.pw span{position:absolute;right:12px;top:10px;cursor:pointer;font-size:1.2rem}h3{margin:14px 0 4px}
.mi{display:flex;justify-content:space-between;padding:13px 4px;border-bottom:1px solid var(--ln);cursor:pointer}
nav{position:fixed;bottom:0;left:0;right:0;max-width:560px;margin:auto;background:var(--sf);border-top:1px solid var(--ln);display:none;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;font:inherit;font-size:.72rem;background:none;border:0;color:var(--mu);padding:8px 0;cursor:pointer;position:relative}nav button span{display:block;font-size:1.3rem}
nav button.on{color:var(--rd);font-weight:700}nav button.on::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;background:var(--rd);border-radius:0 0 4px 4px}
nav i{position:absolute;top:2px;right:26%;background:var(--rd);color:#fff;font-style:normal;font-size:.65rem;border-radius:99px;padding:0 5px}
#toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:99px;display:none;max-width:90%;z-index:9}.un{border-left:4px solid var(--rd)}
</style>
</head>
<body>
<main id="app"></main><nav id="nav"></nav><div id="toast"></div>
<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
window.onerror=m=>{const a=document.getElementById("app");if(a)a.innerHTML="<pre style='color:orange;white-space:pre-wrap'>"+m+"</pre>"};
const SB=supabase.createClient(window.RB.url,window.RB.key);
const $=s=>document.querySelector(s),v=i=>$("#"+i).value,BG=["A+","A-","B+","B-","O+","O-","AB+","AB-"],MAIN=["home","req","notif","me"];
let U=null,ME=null,G={d:[],z:[],u:[]},tab="splash",BACK="home",NC=0,REQ={},DN={},CH=null,LT="m",ROLE="donor",KT="nid",QS="";const VIEW={};
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast=t=>{const x=$("#toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",3200)};
const nm=(a,id)=>(G[a].find(x=>x.id==id)||{}).name||"";
const loc=x=>[nm("u",x.upazila_id),nm("z",x.district_id)].filter(Boolean).join(", ");
const fd=d=>d?new Date(d).toLocaleDateString("bn-BD",{day:"numeric",month:"short",year:"numeric"}):"—";
const np=s=>{s=String(s).replace(/[\s-]/g,"").replace(/^\+?88/,"");return /^01[3-9]\d{8}$/.test(s)?s:null},pe=p=>"88"+p+"@phone.roktobondhu.app";
const ok=r=>{if(r.error){toast(r.error.message);return false}return true};
const hdr=(t,b)=>`<div class="hd"><button onclick="go('${b||BACK}')" aria-label="পিছনে">←</button>${t}</div>`;
const logo=s=>`<svg viewBox="0 0 64 80" width="${s}"><path d="M32 2C32 2 6 34 6 52a26 26 0 0052 0C58 34 32 2 32 2z" fill="#c8102e"/><path d="M32 60s-13-8-13-17a7 7 0 0113-3 7 7 0 0113 3c0 9-13 17-13 17z" fill="#fff"/></svg>`;
const chips=id=>`<div class="chips" id="${id}">${BG.map(b=>`<button type="button">${b}</button>`).join("")}</div>`;
function wireChips(id){const el=$("#"+id);el.onclick=e=>{const b=e.target.closest("button");if(!b)return;const on=b.classList.contains("on");el.querySelectorAll("button").forEach(x=>x.classList.remove("on"));if(!on)b.classList.add("on")}}
const chip=id=>($("#"+id+" .on")||{}).textContent||"",setChip=(id,val)=>$("#"+id).querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.textContent===val));
const geoHTML=p=>`<select id="${p}d"></select><select id="${p}z"></select><select id="${p}u"></select>`;
function wireGeo(p,all){const d=$("#"+p+"d"),z=$("#"+p+"z"),u=$("#"+p+"u"),o=(a,t)=>(all?`<option value="">${t}</option>`:"")+a.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join("");
 const fu=()=>u.innerHTML=o(G.u.filter(x=>x.district_id==z.value),"সব থানা/উপজেলা"),fz=()=>{z.innerHTML=o(G.z.filter(x=>x.division_id==d.value),"সব জেলা");fu()};d.innerHTML=o(G.d,"সব বিভাগ");d.onchange=fz;z.onchange=fu;fz()}
const shrink=f=>new Promise(r=>{const fr=new FileReader();fr.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*s;c.height=i.height*s;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(r,"image/jpeg",.7)};i.src=fr.result};fr.readAsDataURL(f)});

let ADM=false,ADL=null,KB=null,STR=null;
function loadAdmin(){return ADL||(ADL=new Promise(r=>{const e=document.createElement("script");e.src="admin.js?v=3";e.onload=r;e.onerror=r;document.head.appendChild(e)}))}
const avh=(id,n,c)=>`<div class="av ${c||""}" data-av="${id}">${esc((n||"?")[0])}</div>`;
async function loadAv(list){const ids=list.filter(x=>x.avatar).map(x=>x.id);if(!ids.length)return;const r=await SB.storage.from("avatars").createSignedUrls(ids.map(i=>i+"/a.jpg"),3600);
 (r.data||[]).forEach((u,i)=>{if(u.signedUrl)document.querySelectorAll(`[data-av="${ids[i]}"]`).forEach(e=>e.innerHTML=`<img src="${u.signedUrl}" alt="" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`)})}
async function upAv(i){const f=i.files[0];if(!f)return;if(!ok(await SB.storage.from("avatars").upload(`${U.id}/a.jpg`,await shrink(f),{upsert:true,contentType:"image/jpeg"})))return;if(ok(await SB.from("profiles").update({avatar:true}).eq("id",U.id))){toast("ছবি আপলোড হয়েছে");await refresh();go("edit")}}
async function refresh(){if(!G.d.length){const r=await Promise.all(["divisions","districts","upazilas"].map(t=>SB.from(t).select("*").order("name")));G={d:r[0].data||[],z:r[1].data||[],u:r[2].data||[]}}
 U=(await SB.auth.getSession()).data.session?.user||null;ME=null;NC=0;ADM=false;
 if(U){ME=(await SB.from("profiles").select("*").eq("id",U.id).maybeSingle()).data;NC=(await SB.from("notifications").select("id",{count:"exact",head:true}).eq("read",false)).count||0;listen();if(ME?.role==="admin"){const a=await SB.rpc("is_admin");if(a.data===true){ADM=true;await loadAdmin()}}}}
function listen(){if(CH||!U)return;CH=SB.channel("n"+U.id).on("postgres_changes",{event:"INSERT",schema:"public",table:"notifications",filter:"user_id=eq."+U.id},p=>{NC++;toast("🔔 "+p.new.title);try{if(Notification.permission==="granted")new Notification(p.new.title,{body:p.new.body})}catch(e){}if(MAIN.includes(tab))go(tab)}).subscribe()}
function go(t){if(!U&&!["onb","login","reg","splash","newpw"].includes(t))t="onb";if(t==="adm"&&!ADM)t="home";if(MAIN.includes(tab))BACK=tab;tab=t;
 const T=[["home","🏠","হোম"],["req","🆘","অনুরোধ"],["notif","🔔","নোটিফিকেশন"],["me","👤","প্রোফাইল"]],n=$("#nav");n.style.display=U&&MAIN.includes(t)?"flex":"none";
 n.innerHTML=T.map(x=>`<button class="${x[0]===t?"on":""}" onclick="go('${x[0]}')"><span>${x[1]}</span>${x[2]}${x[0]==="notif"&&NC?`<i>${NC}</i>`:""}</button>`).join("");window.scrollTo(0,0);VIEW[t]()}
async function chk(){if(ME?.banned){await SB.auth.signOut();U=null;ME=null;CH=null;ADM=false;toast("আপনার অ্যাকাউন্ট স্থগিত করা হয়েছে")}}
async function boot(){VIEW.splash();await Promise.all([refresh(),new Promise(r=>setTimeout(r,1400))]);await chk();go(U?"home":"onb")}
async function after(){await refresh();await chk();go(U?"home":"login")}
SB.auth.onAuthStateChange(ev=>{if(ev==="PASSWORD_RECOVERY")setTimeout(()=>go("newpw"),2200)});

VIEW.splash=()=>{$("#app").innerHTML=`<div class="sp">${logo(90)}<h1>রক্তবন্ধু</h1><small>ROKTOBONDHU</small><p>আপনার রক্ত,<br>বাঁচাতে পারে একটি প্রাণ।</p><div class="ld"></div><div class="mu">লোড হচ্ছে...</div></div>`};
VIEW.onb=()=>{$("#app").innerHTML=`<div class="sp"><div class="il">🩸🤝</div><h1 style="font-size:1.9rem">রক্ত দিন,<br>জীবন বাঁচান</h1><p>আপনার একটি রক্তদান<br>বাঁচাতে পারে অনেক জীবন।</p><div class="dots"><i></i><i></i><i></i><i></i></div><button class="btn" style="max-width:340px" onclick="go('reg')">এগিয়ে যান →</button><button class="btn o" style="max-width:340px" onclick="go('login')">লগইন করুন</button></div>`};
const pwf=(id,ph,ac)=>`<div class="pw"><input id="${id}" type="password" placeholder="${ph}" autocomplete="${ac}"><span onclick="tgp('${id}',this)">👁</span></div>`;
function tgp(id,el){const i=$("#"+id);i.type=i.type==="password"?"text":"password";el.textContent=i.type==="password"?"👁":"🙈"}
VIEW.login=()=>{$("#app").innerHTML=`<div class="sp" style="min-height:auto;padding-top:24px">${logo(54)}<b style="color:var(--rd);font-size:1.5rem">রক্তবন্ধু</b></div><h3 style="text-align:center">লগইন করুন</h3><input id="lu" type="email" placeholder="ইমেইল" autocomplete="email">${pwf("lp","পাসওয়ার্ড","current-password")}<button class="btn" onclick="login()">লগইন</button><p style="text-align:center"><a href="#" onclick="forgot();return false" style="color:var(--rd)">পাসওয়ার্ড ভুলে গেছেন?</a></p><p style="text-align:center">নতুন অ্যাকাউন্ট? <a href="#" onclick="go('reg');return false" style="color:var(--rd)">রেজিস্টার করুন</a></p>`};
async function login(){if(ok(await SB.auth.signInWithPassword({email:v("lu").trim().toLowerCase(),password:v("lp")})))after()}
async function forgot(){const e=prompt("আপনার ইমেইল লিখুন");if(!e)return;if(ok(await SB.auth.resetPasswordForEmail(e.trim().toLowerCase(),{redirectTo:location.origin})))toast("ইমেইলে রিসেট লিংক পাঠানো হয়েছে, ইনবক্স/স্প্যাম দেখুন")}
VIEW.newpw=()=>{$("#nav").style.display="none";$("#app").innerHTML=`<h3>নতুন পাসওয়ার্ড দিন</h3>${pwf("np1","নতুন পাসওয়ার্ড (৮+ অক্ষর)","new-password")}${pwf("np2","আবার লিখুন","new-password")}<button class="btn" onclick="setPw()">পাসওয়ার্ড বদলান</button>`};
async function setPw(){const a=v("np1");if(a.length<8||a!==v("np2"))return toast("৮+ অক্ষর ও দুটি এক হতে হবে");if(ok(await SB.auth.updateUser({password:a}))){toast("পাসওয়ার্ড বদলানো হয়েছে");after()}}
VIEW.reg=()=>{$("#app").innerHTML=`${hdr("নিবন্ধন করুন","onb")}<div class="seg"><button class="${ROLE==="patient"?"on":""}" onclick="ROLE='patient';VIEW.reg()">রোগী</button><button class="${ROLE==="donor"?"on":""}" onclick="ROLE='donor';VIEW.reg()">ডোনার</button></div>
 <input id="rn" placeholder="নাম লিখুন" autocomplete="name"><input id="re" type="email" placeholder="ইমেইল (পাসওয়ার্ড রিসেটের জন্য)" autocomplete="email"><input id="rp" inputmode="tel" placeholder="মোবাইল নম্বর (01XXXXXXXXX)" autocomplete="tel">${ROLE==="donor"?`<label>রক্তের গ্রুপ</label>${chips("rb")}`:""}<label>ঠিকানা</label>${geoHTML("r")}<input id="ra" placeholder="গ্রাম/মহল্লা/এলাকা">${pwf("rw","পাসওয়ার্ড (৮+ অক্ষর)","new-password")}${pwf("rw2","পাসওয়ার্ড নিশ্চিত করুন","new-password")}
 <button class="btn" onclick="reg()">নিবন্ধন করুন</button><p style="text-align:center">অ্যাকাউন্ট আছে? <a href="#" onclick="go('login');return false" style="color:var(--rd)">লগইন করুন</a></p>`;if(ROLE==="donor")wireChips("rb");wireGeo("r",0)};
async function reg(){const n=v("rn").trim(),e=v("re").trim().toLowerCase(),p=np(v("rp")),w=v("rw"),don=ROLE==="donor";if(!n||!p||!/^\S+@\S+\.\S+$/.test(e))return toast("নাম, ইমেইল ও সঠিক মোবাইল নম্বর দিন");if(w.length<8||w!==v("rw2"))return toast("পাসওয়ার্ড ৮+ অক্ষর ও দুটি এক হতে হবে");if(don&&!chip("rb"))return toast("রক্তের গ্রুপ বাছুন");
 const r=await SB.auth.signUp({email:e,password:w,options:{data:{name:n,phone:p,blood:chip("rb")||"",district_id:v("rz"),upazila_id:v("ru"),area:v("ra").trim(),is_donor:don}}});
 if(r.error)return toast(/Database error/i.test(r.error.message)?"এই মোবাইল নম্বর আগে ব্যবহৃত বা তথ্য সঠিক নয়":r.error.message);
 if(!r.data.session){toast("ইমেইলে পাঠানো লিংকে যাচাই করে লগইন করুন");return go("login")}
 await refresh();toast("নিবন্ধন সম্পন্ন");go(don?"kyc":"home")}

VIEW.home=()=>{const T=[["req","🆘","জরুরি রক্তের অনুরোধ"],["find","🩸","ডোনার খুঁজুন"],["mine","📝","আমার অনুরোধ"],["aware","💡","সচেতনতা"],["svc","📞","জরুরি নম্বর"],["donate","💝","আর্থিক সহায়তা"]];
 $("#app").innerHTML=`<div class="top">${logo(26)}<b>রক্তবন্ধু</b><span onclick="go('notif')" style="font-size:1.4rem">🔔${NC?`<sup style="color:var(--rd)">${NC}</sup>`:""}</span></div>
 <section class="hero"><h2>রক্ত দিন,<br>জীবন বাঁচান</h2><input placeholder="🔍 জেলা/থানা/এলাকা খুঁজুন…" onkeydown="if(event.key==='Enter'){QS=this.value;go('find')}"></section>

VIEW.kyc=async()=>{
 KB=null;const c=await SB.rpc("new_kyc_challenge"),n=c.data||3;
 $("#app").innerHTML=`${hdr("ফেস ভেরিফিকেশন","home")}<div class="card"><b>🛡️ মুখ যাচাই</b><p class="mu">নিজের মুখ স্পষ্ট দেখা যায় এমন একটি লাইভ সেলফি তুলুন। সেলফির সময় <b>ডান হাতের ${n}টি আঙুল</b> দেখান। অ্যাডমিন দেখে অনুমোদন দেবেন। প্রোফাইল ছবির সাথে হুবহু মিলতে হবে না।</p><video id="vd" autoplay playsinline muted style="width:100%;border-radius:14px;background:#000;max-height:320px"></video><canvas id="cv" style="display:none"></canvas><img id="pvw" alt="" style="display:none;width:100%;border-radius:14px">
 <button class="btn" id="cb1" onclick="camOn()">📷 ক্যামেরা চালু করুন</button><button class="btn g" id="cb2" style="display:none" onclick="snap()">ছবি তুলুন</button><label style="display:flex;gap:8px;align-items:flex-start;margin-top:10px"><input id="kc" type="checkbox" style="width:auto;margin-top:4px"><span class="mu">আমি জানি আমার সেলফি নিরাপদে সংরক্ষিত থাকবে এবং স্ক্যামের অভিযোগ উঠলে আইনশৃঙ্খলা বাহিনীকে দেখানো হতে পারে।</span></label><button class="btn g" id="cb3" style="display:none" onclick="kyc()">যাচাইয়ের জন্য জমা দিন</button><input id="kf" type="file" accept="image/*" capture="user" style="display:none" onchange="fromFile(this)"><p class="mu">ক্যামেরা না চললে <a href="#" onclick="$('#kf').click();return false" style="color:var(--rd)">এখানে চেপে সেলফি তুলুন</a>। ছবি প্রাইভেট থাকে, শুধু অ্যাডমিন দেখে।</p></div>`};
async function camOn(){try{STR=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:false});$("#vd").srcObject=STR;$("#cb1").style.display="none";$("#cb2").style.display="block"}catch(e){toast("ক্যামেরার অনুমতি দিন বা নিচের লিংক ব্যবহার করুন")}}
function showPv(b){KB=b;$("#pvw").src=URL.createObjectURL(b);$("#pvw").style.display="block";$("#vd").style.display="none";STR?.getTracks().forEach(t=>t.stop());$("#cb1").style.display="none";$("#cb2").style.display="none";$("#cb3").style.display="block"}
function snap(){const vd=$("#vd"),c=$("#cv"),s=Math.min(1,900/Math.max(vd.videoWidth,vd.videoHeight));c.width=vd.videoWidth*s;c.height=vd.videoHeight*s;c.getContext("2d").drawImage(vd,0,0,c.width,c.height);c.toBlob(showPv,"image/jpeg",.8)}
async function fromFile(i){if(i.files[0])showPv(await shrink(i.files[0]))}
async function kyc(){if(!KB)return toast("আগে সেলফি তুলুন");if(!$("#kc").checked)return toast("সম্মতির বক্সে টিক দিন");const path=`${U.id}/${Date.now()}.jpg`;
 if(!ok(await SB.storage.from("kyc").upload(path,KB,{contentType:"image/jpeg"})))return;
 if(ok(await SB.rpc("submit_kyc",{p:path}))){toast("জমা হয়েছে, অ্যাডমিন যাচাই করবেন");await refresh();go("me")}}
async function delAcc(){if(confirm("আপনার প্রোফাইল ও তথ্য মুছে যাবে। নিরাপত্তার স্বার্থে ফেস ভেরিফিকেশনের ছবি সংরক্ষিত থাকতে পারে। নিশ্চিত?")&&ok(await SB.rpc("delete_my_account"))){await SB.auth.signOut();CH=null;after()}}

let DP=null;window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();DP=e;if(tab==="home")go("home")});
window.addEventListener("appinstalled",()=>{DP=null;toast("অ্যাপ ইনস্টল হয়েছে");if(tab==="home")go("home")});
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const isIOS=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
function instCard(){if(standalone())return "";
 if(DP)return `<div class="card row"><div class="f1"><b>📲 ফোনে অ্যাপ হিসেবে ইনস্টল করুন</b><div class="mu">হোম স্ক্রিন থেকে এক ট্যাপে খুলুন</div></div><button class="btn s" onclick="inst()">ইনস্টল</button></div>`;
 if(isIOS())return `<div class="card"><b>📲 আইফোনে ইনস্টল করুন</b><div class="mu">Safari-তে খুলে নিচের <b>শেয়ার ⬆️</b> বাটনে চাপুন → <b>Add to Home Screen</b> → <b>Add</b>।</div></div>`;
 return `<div class="card"><b>📲 অ্যাপ ইনস্টল করুন</b><div class="mu">Chrome-এর ⋮ মেনু → <b>Install app</b> বা <b>Add to Home screen</b>।</div></div>`}
async function inst(){if(!DP)return;DP.prompt();await DP.userChoice;DP=null;go("home")}
if("serviceWorker"in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
boot();
</script>
</body>
</html>
